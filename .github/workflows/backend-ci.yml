name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate deployment configuration
        env:
          MYSQL_PASSWORD: ci-placeholder
          MYSQL_ROOT_PASSWORD: ci-placeholder
          SECURITY_JWT_SECRET: ci-placeholder
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 deploy/test-deploy.py
          python3 deploy/test-snapshot.py
          python3 -m unittest discover -s scripts/testing -p 'test_*.py'
          bash scripts/test.sh --band F2 --module tools --inspect
          python3 -m py_compile deploy/snapshot-vps.py
          docker compose config --quiet
          docker compose -f compose.local.yaml config --quiet

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Reconcile eligible Surefire sources and execution
        run: python3 scripts/testing/audit_reports.py --kind unit --reports target/surefire-reports --out target/progressive-ci-unit.json

      - name: Preserve unit and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verify-evidence
          path: |
            target/surefire-reports
            target/jacoco.exec
            target/site/jacoco
            target/progressive-ci-*.json

  mysql-migrations:
    name: MySQL migrations
    runs-on: ubuntu-latest
    # This job executes the full MySQL suite twice, including the archive probe.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - name: Verify frozen historical fixture hashes
        run: cd src/test/resources/database/historical && sha256sum -c SHA256SUMS
      - name: Validate empty and historical MySQL schemas
        run: ./mvnw --batch-mode --no-transfer-progress -Pmysql-migrations -DskipUnitTests=true verify
      - name: Reconcile eligible MySQL sources and execution
        run: python3 scripts/testing/audit_reports.py --kind mysql --reports target/failsafe-reports --out target/progressive-ci-mysql.json
      - name: Verify next migration without fixed-version test edits
        run: bash deploy/test-future-migration.sh
      - name: Reconcile forward compatibility execution
        run: python3 scripts/testing/audit_reports.py --kind mysql --reports target/forward-migration-evidence/failsafe-reports --out target/progressive-ci-forward.json
      - name: Preserve migration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-evidence
          path: |
            target/failsafe-reports
            target/audit-evidence
            target/forward-migration-evidence
            target/jacoco.exec
            target/site/jacoco
            target/progressive-ci-*.json

  publications-postgresql:
    name: Publications PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - name: Validate PostgreSQL schema and transactional races
        run: ./mvnw --batch-mode --no-transfer-progress -Ppublications-postgresql -DskipUnitTests=true verify
      - name: Reconcile eligible PostgreSQL sources and execution
        run: python3 scripts/testing/audit_reports.py --kind postgres --reports target/failsafe-reports --out target/progressive-ci-postgres.json
      - name: Preserve PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publications-postgresql-evidence
          path: |
            target/failsafe-reports
            target/progressive-ci-*.json

  deploy:
    name: Deploy to VPS
    needs: [verify, mysql-migrations]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: jeep-club-vps-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_KEY: ${{ secrets.JEEPCLUB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.JEEPCLUB_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publish tested commit
        env:
          VPS_HOST: ${{ secrets.JEEPCLUB_DEPLOY_HOST }}
          VPS_USER: ${{ secrets.JEEPCLUB_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "deploy $DEPLOY_SHA"

      - name: Remove deployment credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
